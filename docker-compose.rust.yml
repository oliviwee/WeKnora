services:
  weknora-rust:
    image: oliviwee/weknora-rust:${WEKNORA_RUST_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.rust
    container_name: WeKnora-Rust
    ports:
      - "${WEKNORA_RUST_PORT:-8080}:8080"
    environment:
      - WEKNORA_SERVER_HOST=0.0.0.0
      - WEKNORA_SERVER_PORT=8080
      - WEKNORA_HEALTHCHECK_HOST=127.0.0.1
    healthcheck:
      test: ["CMD", "/usr/local/bin/weknora-rust", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - weknora-rust-network

networks:
  weknora-rust-network:
    name: WeKnora-Rust-network
